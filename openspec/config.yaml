schema: spec-driven

context: |
  Cactify: plataforma web para gestionar colecciones de cactus y pequeños viveros.
  Registro de plantas por especie, lecturas de cultivo manuales y recomendaciones
  de cuidado generadas por IA a partir de los rangos de la especie y el historial
  de cada planta.

  Tech stack:
  - Backend: Kotlin + Spring Boot 3 (Spring Web, Spring Data JPA) + PostgreSQL + OpenAI API (:8080)
  - Frontend: Nuxt 4 + Vue 3 + Pinia (:3000)
  - Infra local: Docker Compose en iac/local/

  Entidades principales: Species, Plant, CareRecord, AIRecommendation
  (ver docs/diagramas/modelo-datos-actual.md; la evolución prevista, en los borradores
  de docs/diagramas/ — gestión de plantas primero, tareas y alertas después).

  Fuente de requisitos de producto:
  - README.md: descripción de producto, arquitectura, modelo de datos, API
  - docs/user-stories/: historias de usuario (0.x = en alcance del MVP, F.x = roadmap futuro)
  - docs/tickets/: tickets T-01..T-08 que trocean el MVP

  Convenciones:
  - Documentación y specs en español; código e identificadores en inglés
  - Cada change de OpenSpec se deriva de un ticket (T-XX) y referencia sus historias de usuario
  - Una rama y una PR por change; el change se archiva en la misma PR que lo implementa

  Convenciones técnicas transversales (detalle y porqué en docs/adr/):
  - ADR-001: migraciones Flyway SQL versionadas; Hibernate ddl-auto=validate
  - ADR-002: invariantes de dominio también como CHECK/UNIQUE/FK en la base de datos
  - ADR-003: claves primarias TSID (bigint ordenado por tiempo, generado en aplicación con hypersistence-tsid)
  - ADR-004: tests de integración contra PostgreSQL real con Testcontainers (nunca H2)
  - ADR-005: TDD — los escenarios WHEN/THEN de las specs se escriben como tests antes que el código;
    enmendado en T-05: en el frontend el ciclo rojo-verde corre sobre Vitest con `@nuxt/test-utils`,
    `@vue/test-utils` y `happy-dom`, montando componentes con el cliente HTTP doblado y sin levantar
    el backend
  - ADR-006: aislamiento del dominio, web → application → domain, con infrastructure implementando
    los puertos; enmendado en T-02: `domain` admite `Specification`, `Page` y `Pageable` de Spring
    Data y ningún otro tipo de Spring; el puerto vive en `domain/repos` y lo implementa una sola
    interfaz `JpaXRepository : XRepository, JpaRepository<…>` en `infrastructure/persistence`, sin
    clase adaptadora (la búsqueda por id es `findOneById`, no `findById`); los servicios de
    `application` devuelven DTOs, nunca entidades, con `spring.jpa.open-in-view: false`
  - ADR-007: los enums de dominio llevan `value` explícito, `invoke()` que normaliza y falla ante un
    valor desconocido, `toString()` y un `AttributeConverter` con `@Converter(autoApply = true)`;
    nunca `@Enumerated`
  - ADR-008: un tipo de identificador por entidad sobre TSID, mapeado con `@Embeddable`/`@EmbeddedId`
    (JPA ignora `@Convert` sobre un `@Id`); en el API los ids viajan como cadena decimal, tipados en
    el borde, tanto en las respuestas como en los cuerpos de petición
  - ADR-009: ningún endpoint de índice devuelve una colección sin límite; todo listado se sirve con
    el envelope `PageResponse` y orden estable por `@SortDefault`, con tamaño por defecto y máximo
    configurables; los puertos tampoco exponen `findAll()` sin paginar
  - ADR-010: toda fecha del dominio es un `Instant` sobre `timestamptz`, con la sesión JDBC en UTC;
    toda entidad hereda de `AbstractEntity`, que aporta `createdAt`/`updatedAt` selladas por
    `AuditingListener` con el **único** `Clock` del sistema, inyectado (nadie más llama a
    `Instant.now()`); el listener vive en `domain` sin anotaciones de Spring y lo construye un
    `@Bean` de `infrastructure`
  - ADR-011: cada entidad es dueña de su consistencia interna; las invariantes se expresan con
    `require(...)` en un bloque `init` —nunca con anotaciones— y los campos van con `private set`,
    de modo que el cambio pase por métodos de dominio que revalidan; si una invariante necesita un
    colaborador (un reloj), se expresa en una factoría del `companion object` que lo recibe como
    parámetro, y el constructor primario se cierra; `web` solo admite comprobaciones de tipo y de
    rango, y las reglas que consultan otras filas siguen en `application`
  - ADR-012: una integración con un servicio externo se contrata con un puerto en `application`
    —no en `domain`, que es donde van los de repositorio— y su adaptador vive en
    `infrastructure`; por el puerto viajan hechos ya resueltos, nunca formato del proveedor; el
    adaptador captura todo fallo y lo envuelve en una excepción propia de la integración, que el
    manejador global traduce a `502`; la llamada se hace fuera de la transacción de base de datos,
    la sustitución en test es un doble del puerto con `@TestConfiguration` y `@Primary`, el cliente
    es el `RestClient` de Spring y la configuración va por `${VAR:default}`
  - ADR-013: el navegador llega al API con CORS abierto a cualquier origen, configurado con un
    `WebMvcConfigurer` en `infrastructure` sobre todas las rutas y sin credenciales; en
    consecuencia el frontend pide los datos desde el cliente y no en renderizado de servidor. La
    lista de orígenes pasará a variable de entorno en cuanto haya autenticación o despliegue no local
  - ADR-014: el sistema de diseño del frontend se implementa en CSS propio gobernado por tokens, sin
    dependencia de estilos; `tokens.css` (copia sin editar de `docs/ui-kit/`) y `base.css` son las
    únicas hojas globales y el resto del CSS vive en el `<style scoped>` de su componente; los
    componentes del kit están en `app/components/ui/` con prefijo `Ui` y **un solo elemento raíz**,
    para que `data-test` y `aria-*` del punto de uso caigan donde deben; el armazón es
    `layouts/default.vue` y no `app.vue`; la galería del kit es la ruta `/ui-kit` de la propia
    aplicación, fuera de la navegación de producto; la accesibilidad es parte del contrato del
    componente y se verifica con tests en lo que `happy-dom` observa —marcado, ARIA y foco— y a ojo
    en la galería en lo puramente visual

rules:
  proposal:
    - Referenciar siempre el ticket (T-XX) y las historias de usuario (0.x) que originan el change
    - Incluir una sección de "Non-goals" para acotar el alcance
  design:
    - Consultar docs/adr/ antes de decidir; referenciar el ADR aplicable en lugar de re-decidir
    - Si surge una decisión transversal nueva (aplicable a futuros changes), proponer promocionarla a un ADR nuevo en docs/adr/
    - Situar cada pieza en su capa según ADR-006 enmendado; los controllers solo inyectan servicios de application, y el mapeo a DTO ocurre dentro de la transacción
    - Cualquier restricción nueva de datos va en una migración Flyway nueva (ADR-001 y ADR-002); V1__schema.sql está aplicada y no se edita
  specs:
    - Escenarios en formato WHEN/THEN, en español
    - Consultar openspec/specs/ antes de escribir el delta y no redeclarar lo ya construido; el contrato transversal del API (ids como cadena, envelope de paginación y cuerpo de error uniforme) vive en la capability plant-inventory
    - Todo listado nuevo se especifica paginado (ADR-009); una referencia inexistente o un cuerpo inválido nunca es un 5xx
  tasks:
    - Tareas pequeñas y verificables
    - Orden test-first (ADR-005), cada bloque funcional empieza por las tareas de test de sus escenarios (rojo) seguidas de la implementación que las pone en verde

operations:
  apply:
    guidance:
      - "TDD (ADR-005): escribir primero el test del escenario y verlo fallar, después la implementación mínima que lo pone en verde, después refactorizar. No escribir código de producción sin un test en rojo que lo justifique."
