server:
  port: 8080
spring:
  application:
    name: cactify
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cactify}
    username: ${SPRING_DATASOURCE_USERNAME:cactify}
    password: ${SPRING_DATASOURCE_PASSWORD:cactify}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      # Diez archivos de hasta 10 MB por subida (ADR-018): el cuerpo entero puede pasar de 100 MB. Superarlo es 413.
      max-file-size: ${MEDIA_MAX_FILE_SIZE:10MB}
      max-request-size: ${MEDIA_MAX_REQUEST_SIZE:110MB}
  data:
    web:
      pageable:
        default-page-size: ${PAGE_SIZE_DEFAULT:25}
        max-page-size: ${PAGE_SIZE_MAX:500}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

cactify:
  export:
    # Filas máximas de una exportación a CSV. Por encima, 422: nunca se trunca en silencio (ADR-017).
    max-rows: ${EXPORT_MAX_ROWS:5000}
  batch:
    # Plantas máximas de un lote. Por encima, 422: nunca se aplica a «las primeras N» en silencio.
    max-plants: ${BATCH_MAX_PLANTS:2000}
  care-records:
    # Margen que se admite por delante del reloj del servidor al aceptar la fecha de una lectura:
    # absorbe un movil ligeramente desincronizado sin dar por buena una fecha equivocada.
    max-future-skew: ${CARE_RECORD_MAX_FUTURE_SKEW:PT5M}
  alerts:
    # Umbrales de detección y de escalada de las alertas (T-23). Una configuración incoherente impide arrancar.
    unreviewed-days: ${ALERTS_UNREVIEWED_DAYS:30}
    overdue-days: ${ALERTS_OVERDUE_DAYS:2}
    medium-occurrences: ${ALERTS_MEDIUM_OCCURRENCES:3}
    critical-occurrences: ${ALERTS_CRITICAL_OCCURRENCES:6}
    medium-deviation: ${ALERTS_MEDIUM_DEVIATION:0.25}
    critical-deviation: ${ALERTS_CRITICAL_DEVIATION:0.75}
    scheduler:
      # El proceso diario de «sin revisar» y «cuidado vencido». Se apaga con false (los tests lo apagan).
      enabled: ${ALERTS_SCHEDULER_ENABLED:true}
      cron: ${ALERTS_SCHEDULER_CRON:0 0 6 * * *}
  media:
    # Fotografias (T-19, ADR-018). Los binarios viven en disco, en un volumen que hay que respaldar junto con la base.
    root: ${MEDIA_ROOT:./data/media}
    max-file-size: ${MEDIA_MAX_FILE_SIZE:10MB}
    max-files: ${MEDIA_MAX_FILES:10}
    max-per-owner: ${MEDIA_MAX_PER_OWNER:50}
    # Antes de decodificar se rechaza lo que supere estos píxeles: una imagen enorme no tumba el proceso.
    max-pixels: ${MEDIA_MAX_PIXELS:50000000}
    thumb-side: ${MEDIA_THUMB_SIDE:320}
    medium-side: ${MEDIA_MEDIUM_SIDE:1280}
    max-full-side: ${MEDIA_MAX_FULL_SIDE:4096}
    quality: ${MEDIA_QUALITY:0.85}
    orphan-min-age: ${MEDIA_ORPHAN_MIN_AGE:P1D}
    cleanup:
      # El barrido semanal de archivos sin fila. Se apaga con false (los tests lo apagan).
      enabled: ${MEDIA_CLEANUP_ENABLED:true}
      cron: ${MEDIA_CLEANUP_CRON:0 0 4 * * SUN}
  ai:
    # Vacía por defecto: sin clave el adaptador responde 502 en vez de arrancar roto, y los tests
    # de integración sustituyen el puerto por un doble sin tocar la red (ADR-012).
    api-key: ${OPENAI_API_KEY:}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    model: ${OPENAI_MODEL:gpt-4o-mini}
    # Una recomendación se pide desde la pantalla de detalle y el usuario está esperando: más allá
    # de este margen conviene devolver el error antes que seguir bloqueando la petición.
    timeout: ${OPENAI_TIMEOUT:PT20S}
